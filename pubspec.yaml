name: frontend
description: "Work Order Flutter Frontend"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  geolocator: ^14.0.3
  image_picker: ^1.2.2
  image: ^4.8.0
  http: ^1.6.0
  connectivity_plus: ^7.1.1
  http_parser: ^4.1.2
  camera: ^0.11.0+2
  permission_handler: ^11.3.1
  flutter_image_compress: ^2.4.0
  share_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true